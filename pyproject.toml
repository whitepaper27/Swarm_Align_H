[project]
name = "aiv"
version = "0.1.0"
description = "Access Isn't Verification: approval verification across agent handoffs (Apart Swarm Alignment Hackathon 2026)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "matplotlib>=3.7",
]

[project.scripts]
aiv = "aiv.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiv"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["runs", "protocol/frozen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
